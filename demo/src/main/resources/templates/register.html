<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
            <div class="card shadow fade-in">
                <div class="card-header text-center bg-success text-white">
                    <h3><i class="fas fa-user-plus me-2"></i>Регистрация</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" name="username" id="username" class="form-control" required minlength="3">
                            <div class="form-text">Минимум 3 символа</div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" name="password" id="password" class="form-control" required minlength="4">
                            <div class="form-text">Минимум 4 символа</div>
                        </div>

                        <!-- Сообщения -->
                        <div th:if="${param.message}" class="alert alert-success">
                            <th:block th:text="${param.message[0]}"></th:block>
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger">
                            <th:block th:text="${param.error[0]}"></th:block>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p>Уже есть аккаунт?
                            <a th:href="@{/login}" class="link-primary">Войти</a>
                        </p>
                        <p><a th:href="@{/tours/}" class="link-secondary">← На главную</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
