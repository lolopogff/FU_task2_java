<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
        }
        .form-card {
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Редактирование тура</h1>
        <a th:href="@{/tours/}" class="btn btn-secondary">← Назад к списку</a>
    </div>

    <div th:if="${tour != null}">
        <div class="card form-card">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">✏️ Редактирование информации о туре</h5>
            </div>
            <div class="card-body">
                <!-- Форма для редактирования данных -->
                <form th:action="@{/tours/{id}(id=${tour.id})}" th:object="${tour}" method="post">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">ID тура</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${tour.id}"
                                   readonly
                                   disabled
                                   style="background-color: #f8f9fa;">
                            <div class="form-text">ID тура не может быть изменен.</div>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="destination" class="form-label">Направление *</label>
                            <input type="text"
                                   class="form-control"
                                   id="destination"
                                   th:field="*{destination}"
                                   required
                                   placeholder="Введите направление">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label">Цена ($) *</label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   th:field="*{price}"
                                   step="0.01"
                                   min="0"
                                   required
                                   placeholder="0.00">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="departureDate" class="form-label">Дата вылета *</label>
                            <input type="text"
                                   class="form-control"
                                   id="departureDate"
                                   th:field="*{departureDate}"
                                   required
                                   placeholder="ГГГГ-ММ-ДД">
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <button type="submit" class="btn btn-warning btn-lg me-md-2">
                            💾 Обновить тур
                        </button>
                        <a th:href="@{/tours/{id}(id=${tour.id})}" class="btn btn-info btn-lg me-md-2">
                            👁️ Просмотр тура
                        </a>
                        <a th:href="@{/tours/}" class="btn btn-outline-secondary btn-lg">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${tour == null}" class="alert alert-warning text-center">
        <h4>Тур не найден</h4>
        <p>Тур, который вы пытаетесь редактировать, не может быть найден.</p>
        <a th:href="@{/tours/}" class="btn btn-primary">Вернуться к списку туров</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
