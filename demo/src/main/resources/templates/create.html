<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Создание нового тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- Шапка с кнопкой выхода -->
    <div class="d-flex justify-content-between align-items-center my-4">
        <div>
            <h1 class="h3"><i class="fas fa-plus-circle me-3"></i>Создание нового тура</h1>
        </div>
        <div sec:authorize="isAuthenticated()">
            <span class="me-3">Привет, <strong sec:authentication="name"></strong>!</span>
            <a th:href="@{/logout}" class="btn btn-outline-danger">
                <i class="fas fa-sign-out-alt me-2"></i>Выйти
            </a>
        </div>
    </div>

    <!-- Доступ только для ADMIN -->
    <div sec:authorize="hasRole('ADMIN')">
        <div class="main-header fade-in">
            <p class="lead">Добавьте информацию о новом туре</p>
        </div>

        <div class="form-container">
            <div class="form-card fade-in">
                <div class="form-header">
                    <h2><i class="fas fa-info-circle me-2"></i>Информация о туре</h2>
                </div>
                <div class="form-body">
                    <form th:action="@{/tours/}" th:object="${tour}" method="post">
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="destination" class="form-label">
                                        <i class="fas fa-map-marker-alt me-2"></i>Направление *
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           id="destination"
                                           th:field="*{destination}"
                                           required
                                           placeholder="Введите направление (например, Париж, Лондон, Токио)">
                                    <div class="form-text">Введите город или страну для тура.</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="price" class="form-label">
                                        <i class="fas fa-dollar-sign me-2"></i>Цена ($) *
                                    </label>
                                    <input type="number"
                                           class="form-control"
                                           id="price"
                                           th:field="*{price}"
                                           step="0.01"
                                           min="0"
                                           required
                                           placeholder="0.00">
                                    <div class="form-text">Введите цену в долларах США.</div>
                                </div>
                            </div>

                            <div class="form-col">
                                <div class="form-group">
                                    <label for="departureDate" class="form-label">
                                        <i class="fas fa-calendar-alt me-2"></i>Дата вылета *
                                    </label>
                                    <input type="text"
                                           class="form-control"
                                           id="departureDate"
                                           th:field="*{departureDate}"
                                           required
                                           placeholder="ГГГГ-ММ-ДД">
                                    <div class="form-text">Формат: ГГГГ-ММ-ДД</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save me-2"></i>Создать тур
                            </button>
                            <a th:href="@{/tours/}" class="btn btn-outline-secondary btn-lg">
                                <i class="fas fa-arrow-left me-2"></i>Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Сообщение, если нет прав (USER или неавторизован) -->
    <div sec:authorize="!hasRole('ADMIN')">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="alert alert-danger text-center p-5">
                    <i class="fas fa-lock fa-3x mb-4"></i>
                    <h3>Доступ запрещён</h3>
                    <p class="lead">Только пользователи с ролью <strong>ADMIN</strong> могут создавать новые туры.</p>
                    <a th:href="@{/tours/}" class="btn btn-primary btn-lg mt-3">
                        <i class="fas fa-arrow-left me-2"></i>Вернуться к списку туров
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
