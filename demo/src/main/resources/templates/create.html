<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание нового тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="main-header fade-in">
        <h1><i class="fas fa-plus-circle me-3"></i>Создание нового тура</h1>
        <p class="lead">Добавьте информацию о новом туре</p>
    </div>

    <div class="form-container">
        <div class="form-card fade-in">
            <div class="form-header">
                <h2><i class="fas fa-info-circle me-2"></i>Информация о туре</h2>
            </div>
            <div class="form-body">
                <form th:action="@{/tours/}" th:object="${tour}" method="post">
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="destination" class="form-label">
                                    <i class="fas fa-map-marker-alt me-2"></i>Направление *
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="destination"
                                       th:field="*{destination}"
                                       required
                                       placeholder="Введите направление (например, Париж, Лондон, Токио)">
                                <div class="form-text">Введите город или страну для тура.</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="price" class="form-label">
                                    <i class="fas fa-dollar-sign me-2"></i>Цена ($) *
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="price"
                                       th:field="*{price}"
                                       step="0.01"
                                       min="0"
                                       required
                                       placeholder="0.00">
                                <div class="form-text">Введите цену в долларах США.</div>
                            </div>
                        </div>

                        <div class="form-col">
                            <div class="form-group">
                                <label for="departureDate" class="form-label">
                                    <i class="fas fa-calendar-alt me-2"></i>Дата вылета *
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="departureDate"
                                       th:field="*{departureDate}"
                                       required
                                       placeholder="ГГГГ-ММ-ДД">
                                <div class="form-text">Формат: ГГГГ-ММ-ДД</div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save me-2"></i>Создать тур
                        </button>
                        <a th:href="@{/tours/}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-arrow-left me-2"></i>Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
