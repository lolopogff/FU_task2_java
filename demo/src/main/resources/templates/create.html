<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание нового тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
        }
        .form-card {
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Создание нового тура</h1>
        <a th:href="@{/tours/}" class="btn btn-secondary">← Назад к списку</a>
    </div>

    <div class="card form-card">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">📝 Информация о туре</h5>
        </div>
        <div class="card-body">
            <!-- Форма для ввода данных -->
            <form th:action="@{/tours/}" th:object="${tour}" method="post">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="destination" class="form-label">Направление *</label>
                        <input type="text"
                               class="form-control"
                               id="destination"
                               th:field="*{destination}"
                               required
                               placeholder="Введите направление (например, Париж, Лондон, Токио)">
                        <div class="form-text">Введите город или страну для тура.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Цена ($) *</label>
                        <input type="number"
                               class="form-control"
                               id="price"
                               th:field="*{price}"
                               step="0.01"
                               min="0"
                               required
                               placeholder="0.00">
                        <div class="form-text">Введите цену в долларах США.</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="departureDate" class="form-label">Дата вылета *</label>
                        <input type="text"
                               class="form-control"
                               id="departureDate"
                               th:field="*{departureDate}"
                               required
                               placeholder="ДД-ММ-ГГГГ">
                        <div class="form-text">Формат: ГГГГ-ММ-ДД</div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <button type="submit" class="btn btn-success btn-lg me-md-2">
                        💾 Создать тур
                    </button>
                    <a th:href="@{/tours/}" class="btn btn-outline-secondary btn-lg">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
