<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Система управления турами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 1200px;
        }
        .table-actions {
            white-space: nowrap;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="header text-center">
        <h1>🌍 Система управления турами</h1>
        <p class="lead">Эффективное управление вашими турами</p>
    </div>

    <!-- Форма для поиска/фильтрации (опционально) -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="card-title mb-0">Все туры</h5>
                </div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/tours/new}" class="btn btn-primary">
                        ➕ Добавить новый тур
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Таблица для отображения всех записей -->
    <div class="card">
        <div class="card-body">
            <div th:if="${tours != null and !tours.empty}">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Направление</th>
                            <th>Цена</th>
                            <th>Дата вылета</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tour : ${tours}">
                            <td th:text="${tour.id}">1</td>
                            <td th:text="${tour.destination}">Париж</td>
                            <td th:text="'$' + ${tour.price}">$1000.00</td>
                            <td th:text="${tour.departureDate}">2024-01-15</td>
                            <td class="table-actions">
                                <a th:href="@{/tours/{id}(id=${tour.id})}"
                                   class="btn btn-info btn-sm">👁️ Просмотр</a>
                                <a th:href="@{/tours/{id}/edit(id=${tour.id})}"
                                   class="btn btn-warning btn-sm">✏️ Редактировать</a>
                                <form th:action="@{/tours/{id}/delete(id=${tour.id})}"
                                      method="post"
                                      style="display: inline;"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить этот тур?')">
                                    <button type="submit" class="btn btn-danger btn-sm">🗑️ Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${tours == null or tours.empty}" class="text-center py-4">
                <div class="alert alert-info">
                    <h4>Туры не найдены</h4>
                    <p class="mb-3">В системе пока нет туров. Создайте первый тур!</p>
                    <a th:href="@{/tours/new}" class="btn btn-primary">Создать первый тур</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
