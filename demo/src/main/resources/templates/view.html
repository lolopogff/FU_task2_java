<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Детали тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center my-4">
        <div>
            <h1><i class="fas fa-eye me-3"></i>Детали тура</h1>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/logout}" class="btn btn-outline-danger">Выйти</a>
        </div>
    </div>

    <div th:if="${tour != null}">
        <div class="detail-card fade-in">
            <div class="detail-header">
                <h2><i class="fas fa-map-marker-alt me-2"></i><span th:text="${tour.destination}">Направление</span></h2>
                <p class="mb-0">ID тура: <span th:text="${tour.id}">1</span></p>
            </div>

            <div class="detail-body">
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-id-card me-2"></i>ID тура:</span>
                    <span class="detail-value" th:text="${tour.id}">1</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-map-marker-alt me-2"></i>Направление:</span>
                    <span class="detail-value h5 text-primary" th:text="${tour.destination}">Париж</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-dollar-sign me-2"></i>Цена:</span>
                    <span class="detail-value h5 text-success" th:text="'$' + ${tour.price}">$1000.00</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fas fa-calendar-alt me-2"></i>Дата вылета:</span>
                    <span class="detail-value h5" th:text="${tour.departureDate}">2024-01-15</span>
                </div>
            </div>

            <div class="detail-actions">
                <a th:href="@{/tours/{id}/edit(id=${tour.id})}"
                   class="btn btn-warning"
                   sec:authorize="hasRole('ADMIN')">
                    <i class="fas fa-edit me-2"></i>Редактировать тур
                </a>
                <a th:href="@{/tours/}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Назад к списку
                </a>
                <form th:action="@{/tours/{id}/delete(id=${tour.id})}"
                      method="post"
                      style="display: inline;"
                      onsubmit="return confirm('Вы уверены, что хотите удалить этот тур?')"
                      sec:authorize="hasRole('ADMIN')">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash me-2"></i>Удалить тур
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${tour == null}">
        <div class="card fade-in text-center py-5">
            <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
            <h3>Тур не найден</h3>
            <p>Запрошенный тур не существует.</p>
            <a th:href="@{/tours/}" class="btn btn-primary">Вернуться к списку</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
