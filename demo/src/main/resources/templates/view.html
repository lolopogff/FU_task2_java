<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали тура</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
        }
        .tour-card {
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Детали тура</h1>
        <a th:href="@{/tours/}" class="btn btn-secondary">← Назад к списку</a>
    </div>

    <div th:if="${tour != null}">
        <div class="card tour-card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">📍 <span th:text="${tour.destination}">Направление тура</span></h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <strong>ID тура:</strong>
                            <div class="text-muted" th:text="${tour.id}">1</div>
                        </div>
                        <div class="mb-3">
                            <strong>Направление:</strong>
                            <div class="h5 text-primary" th:text="${tour.destination}">Париж</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <strong>Цена:</strong>
                            <div class="h5 text-success" th:text="'$' + ${tour.price}">$1000.00</div>
                        </div>
                        <div class="mb-3">
                            <strong>Дата вылета:</strong>
                            <div class="h6" th:text="${tour.departureDate}">2024-01-15</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-light">
                <div class="d-flex gap-2">
                    <a th:href="@{/tours/{id}/edit(id=${tour.id})}" class="btn btn-warning">
                        ✏️ Редактировать тур
                    </a>
                    <a th:href="@{/tours/}" class="btn btn-secondary">
                        📋 Назад к списку
                    </a>
                    <form th:action="@{/tours/{id}/delete(id=${tour.id})}"
                          method="post"
                          style="display: inline;"
                          onsubmit="return confirm('Вы уверены, что хотите удалить этот тур?')">
                        <button type="submit" class="btn btn-danger">
                            🗑️ Удалить тур
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${tour == null}" class="alert alert-warning text-center">
        <h4>Тур не найден</h4>
        <p>Запрошенный тур не может быть найден.</p>
        <a th:href="@{/tours/}" class="btn btn-primary">Вернуться к списку туров</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
